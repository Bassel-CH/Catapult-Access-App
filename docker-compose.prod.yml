# Production: one container running nginx and the backend, behind an HTTPS
# proxy. Use this file on its own:
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Host requirements are in deploy/README.md.

# Without its own name, this would share the dev stack's project and
# `--remove-orphans` here would delete the dev containers.
name: audit-prod

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: audit-app:${IMAGE_TAG:-local}
    ports:
      # Loopback only: the container trusts the headers the front proxy sends,
      # so nothing else may reach 8080. A containerized front proxy should join
      # this compose network and use app:8080 rather than widening this.
      - "127.0.0.1:8080:8080"
    # The container exits if nginx or the backend stops; this brings it back.
    restart: unless-stopped
    # Equal limits mean no swap, so the app's memory never reaches the host's
    # disk. Running out restarts this container rather than the host choosing
    # what to kill.
    mem_limit: 1g
    memswap_limit: 1g
    # supervisord gives each process up to 5s to stop.
    stop_grace_period: 15s
