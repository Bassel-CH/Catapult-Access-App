# docker-compose.prod.yml  —  PROD  (standalone, NOT layered on the base file)
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Use this file ON ITS OWN. Don't add `-f docker-compose.yml`: the base defines
# the separate dev backend/frontend services, and they'd start alongside this.
#
# One container (built from the root Dockerfile) runs nginx and uvicorn under
# supervisord. nginx serves the SPA and forwards /api/ to uvicorn inside the
# container; uvicorn is not published, so 8080 is the only way in. It's bound
# to the host's loopback, so health checks run on the host itself:
# http://127.0.0.1:8080/api/health. Users reach the app over HTTPS through the
# host's nginx (deploy/host-nginx.conf.example).

# Its own project name. Without it, Compose would use the folder name — the same
# project as the dev stack — and `--remove-orphans` here would delete your dev
# containers.
name: audit-prod

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: audit-app
    ports:
      # Loopback only: the host's nginx (deploy/host-nginx.conf.example) is the
      # one thing allowed to reach 8080, because the container trusts the
      # headers it sends. If the front proxy ever runs in a container instead
      # of on the host, it can't reach the host's 127.0.0.1; put it on the same
      # compose network and have it use app:8080, rather than widening this.
      - "127.0.0.1:8080:8080"
    # If nginx or uvicorn dies, the container exits (see deploy/supervisord.conf)
    # and this brings it back. Every restart loses in-memory sessions.
    restart: unless-stopped
    # supervisord gives each program up to 5s to stop; leave room for both.
    stop_grace_period: 15s
