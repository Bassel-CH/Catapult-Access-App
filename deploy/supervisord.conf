; supervisord in the production container: starts nginx and the backend.
;
; It never restarts either one itself. If one exits, the stop-container-on-crash
; listener stops supervisord, the container exits, and the platform's restart
; policy starts a fresh one. Sessions are in the backend's memory, so a backend
; restart loses them anyway; restarting the whole container costs nothing extra
; and shows in Docker's restart count.

[supervisord]
nodaemon=true
; In the foreground supervisord already prints its log to the container's
; output; a logfile of /dev/stdout would print every line twice.
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; Lets `supervisorctl status` work inside the container, for debugging.
; supervisord logs a CRIT line at startup because the socket has no password.
; Expected: chmod 0700 means only appuser — which already runs everything
; here — can use it.
[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:nginx]
; -e stderr: otherwise nginx tries its compiled-in /var/log/nginx/error.log
; before reading the config, which appuser can't write.
command=nginx -e stderr -c /etc/nginx/nginx.conf
autorestart=false
startretries=0
; QUIT = graceful: finish in-flight requests, then stop.
stopsignal=QUIT
stopwaitsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:uvicorn]
; One process, no --workers: sessions are in memory (see README, "Run exactly
; one backend instance"). Bound to 127.0.0.1 so only nginx can reach it.
command=uvicorn app.main:app --host 127.0.0.1 --port 8000 --proxy-headers --forwarded-allow-ips 127.0.0.1
directory=/srv/backend
autorestart=false
startretries=0
stopsignal=TERM
stopwaitsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[eventlistener:stop-container-on-crash]
command=python /srv/deploy/stop_container_on_crash.py
events=PROCESS_STATE_EXITED,PROCESS_STATE_FATAL
; The listener's stdout is its channel to supervisord, so only stderr is logged.
stdout_logfile=NONE
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
