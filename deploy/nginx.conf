# nginx inside the production container: serves the built frontend and passes
# /api/ to the backend on 127.0.0.1:8000.
#
# A full nginx.conf rather than a conf.d snippet, because nginx runs as the
# non-root appuser and every path it writes must point at /tmp.

worker_processes auto;
pid /tmp/nginx.pid;
error_log stderr warn;

# Foreground, so supervisord can watch it.
daemon off;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;

    sendfile on;
    server_tokens off;

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    # HTTPS always ends at a proxy in front of this container, which reports
    # the scheme and host the user connected with. Pass those through; fall
    # back to this container's own view only for direct hits like the health
    # check. Safe only because nothing but the front proxy can reach 8080
    # (docs/decisions.md).
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }
    map $http_x_forwarded_host $forwarded_host {
        default $http_x_forwarded_host;
        ""      $host;
    }

    server {
        listen 8080;
        server_name _;

        root /srv/frontend;
        index index.html;

        # Unknown paths get index.html, so a refresh on any app page still
        # loads the app.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Vite puts a content hash in these filenames, so they never change.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Not hashed: a cached copy would point at assets a deploy removed.
        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        # FastAPI's docs are at the root, not under /api/, so they'd otherwise
        # get the app's page with a 200.
        location ~ ^/(docs|redoc|openapi\.json)(/|$) {
            return 404;
        }

        location /api/ {
            # No trailing slash: the backend's routes include /api, so the path
            # must pass through unchanged.
            proxy_pass http://127.0.0.1:8000;

            # Access control belongs at the front proxy, not here: see the
            # marked block in deploy/host-nginx.conf.example.

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            # Replaced, never appended, so the backend can't receive an address
            # the client made up. This is the front proxy's address; nothing
            # reads visitor addresses today.
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host  $forwarded_host;

            # Just above the backend's 10 MB limit (MAX_UPLOAD_SIZE), so the
            # backend gives the "too large" message for anything near it.
            client_max_body_size 11m;

            # Uploads hold permission data: keep the whole body in memory
            # rather than a temp file.
            client_body_buffer_size 11m;

            # Exports and reports too: never spill a response to a temp file.
            # nginx holds what fits in its small buffers and otherwise makes
            # the backend wait for the browser, which is fine at our sizes but
            # would hold connections open with much larger responses.
            proxy_max_temp_file_size 0;
        }

        gzip on;
        gzip_types text/plain text/css application/javascript application/json image/svg+xml;
        gzip_min_length 1024;
    }
}
