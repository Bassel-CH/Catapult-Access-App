# nginx for the combined production image: serves the built SPA and forwards
# /api/ to uvicorn, which runs in the same container on 127.0.0.1:8000.
#
# This is a full nginx.conf, not a conf.d snippet, because nginx runs as the
# non-root appuser: the pid file and every temp path must point at /tmp, the
# only place it can write.

worker_processes auto;
pid /tmp/nginx.pid;
error_log stderr warn;

# Run in the foreground so supervisord can watch it.
daemon off;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Debian's package logs to files under /var/log/nginx; send them to the
    # container's output instead so `docker logs` shows them.
    access_log /dev/stdout;

    sendfile on;
    server_tokens off;

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    # This container never handles HTTPS: a proxy in front always does (an AWS
    # load balancer, or nginx on the host; see deploy/README.md). That front
    # proxy says which scheme and host the user connected with, so pass its
    # values through. Fall back to this container's own view only when there
    # is no front proxy, e.g. the health check hitting 8080 directly.
    # Trusting these is safe only because nothing but the front proxy can
    # reach port 8080. That is a deployment requirement, not something this
    # file can enforce.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }
    map $http_x_forwarded_host $forwarded_host {
        default $http_x_forwarded_host;
        ""      $host;
    }

    server {
        listen 8080;
        server_name _;

        root /srv/frontend;
        index index.html;

        # SPA fallback. A React app owns its routes client-side, so a hard
        # refresh on /audit/123 asks nginx for a file that does not exist.
        # Without this, nginx returns 404 and the app never boots. try_files
        # says: real file, then real directory, then hand index.html to the
        # router.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Vite fingerprints these filenames (app.4f3a1b.js), so the content at
        # a given URL can never change — safe to cache hard and forever.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # index.html is NOT fingerprinted. If a browser caches it, the user
        # keeps loading an old page that references deleted asset hashes after
        # a deploy.
        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        # FastAPI's docs live at the root (/docs, /redoc, /openapi.json), not
        # under /api/, so they never reach the backend here — and the SPA
        # fallback would answer them with the React app and a 200. Say plainly
        # that they don't exist.
        location ~ ^/(docs|redoc|openapi\.json)(/|$) {
            return 404;
        }

        location /api/ {
            # No trailing slash on the target: the backend's routes all start
            # with /api, so the path must be passed through unchanged.
            # "http://127.0.0.1:8000/" would strip /api and 404 every call.
            proxy_pass http://127.0.0.1:8000;

            # Access control (allowlists, sign-in) is not added here. It
            # belongs at the front proxy, where HTTPS ends; see the marked
            # block in deploy/host-nginx.conf.example.

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            # Replace, never append: a client could send its own
            # X-Forwarded-For, and the backend would receive whatever it made
            # up. Only the address nginx actually sees is passed on, which is
            # the front proxy's. Nothing reads the client address today; if
            # something needs it later, trust the front proxy for it then.
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host  $forwarded_host;

            # The backend accepts uploads up to 10 MB (MAX_UPLOAD_SIZE); allow
            # that plus multipart overhead, so the backend — not nginx — gives
            # the "too large" answer the frontend knows how to show.
            client_max_body_size 11m;

            # Upload going in: uploads are real permissions data. A buffer
            # this size keeps the whole request body in memory instead of a
            # temp file on disk, while nginx still absorbs slow uploads before
            # uvicorn sees them.
            client_body_buffer_size 11m;

            # Response coming back (exports, reports, also permissions data):
            # 0 means nginx may not spill the backend's response to a temp
            # file. It keeps what fits in its small memory buffers and
            # otherwise makes the backend wait until the browser has read
            # more. Fine for our export sizes; with much larger responses a
            # slow download would hold the backend's connection open.
            proxy_max_temp_file_size 0;
        }

        gzip on;
        gzip_types text/plain text/css application/javascript application/json image/svg+xml;
        gzip_min_length 1024;
    }
}
