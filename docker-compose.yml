# Dev stack: `docker compose up` reads this file and then
# docker-compose.override.yml. Production uses docker-compose.prod.yml on its
# own. See docs/docker.md.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: audit-backend

  frontend:
    image: node:22-alpine
    depends_on:
      - backend

networks:
  default:
    name: audit-net
