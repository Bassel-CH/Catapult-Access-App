# Static server for the built SPA.
#
# Deliberately does NOT proxy /api. That belongs to the edge proxy in the next
# phase — putting it here too would mean two places to change at the domain
# cutover, and this container would need to know the backend's address.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback. A React app owns its routes client-side, so a hard refresh
    # on /audit/123 asks nginx for a file that does not exist. Without this,
    # nginx returns 404 and the app never boots. try_files says: real file, then
    # real directory, then hand index.html to the router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints these filenames (app.4f3a1b.js), so the content at a
    # given URL can never change — safe to cache hard and forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html is NOT fingerprinted. If a browser caches it, the user keeps
    # loading an old page that references deleted asset hashes after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
