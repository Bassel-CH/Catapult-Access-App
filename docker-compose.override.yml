# Dev stack, applied automatically on top of docker-compose.yml by
# `docker compose up`: live-mounted code, uvicorn --reload, and the Vite dev
# server instead of nginx.

services:
  backend:
    ports:
      - "8000:8000"
    volumes:
      # Only app/ is mounted, so the image's installed packages stay in place.
      - ./backend/app:/srv/backend/app
    # Your WSL user, so files the container touches stay yours.
    user: "1000:1000"
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
    environment:
      - ENABLE_API_DOCS=true

  frontend:
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # Keeps the container's own node_modules from being hidden by the mount.
      - /app/node_modules
    # Runs as root, unlike the backend: Docker creates the node_modules volume
    # above owned by root, and npm running as 1000 couldn't write to it. This is
    # the dev server only; production runs as a non-root user.
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      # Where Vite's dev proxy (vite.config.ts) sends /api inside compose.
      - VITE_PROXY_TARGET=http://backend:8000
    depends_on:
      - backend
